appId: com.streamwatch.app
productName: StreamWatch
directories:
  buildResources: build
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.*'
  - '!{.eslintignore,.eslintrc.cjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
linux:
  target:
    - AppImage
    - deb
  maintainer: animewatch
  category: Video
mac:
  target:
    - dmg
    - zip
  entitlementsInherit: build/entitlements.mac.plist
  # Ad-hoc sign. The only cert in the keychain is an "Apple Development"
  # identity, which cannot notarize; electron-builder would otherwise
  # auto-discover it and sign for distribution with the hardened runtime,
  # which this app (webview + disablewebsecurity) has never been tested under.
  # Set this to a "Developer ID Application" identity if one is ever added.
  identity: null
win:
  target:
    - nsis
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  deleteAppDataOnUninstall: false
npmRebuild: true
publish:
  provider: github
  owner: AlexMakesC0de
  repo: anime-watch
